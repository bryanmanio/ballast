			outputPaths = (
				"$(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/nas/ballast-agent",
				"$(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/nas/install.sh",
				"$(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/nas/install-key.sh",
				"$(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/nas/deploy.sh",
				"$(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/nas/deploy-key.sh",
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "set -eu\n# The setup window hands the user a path to deploy.sh, so the scripts have\n# to travel with the app rather than live only in a repo checkout. All five:\n# deploy.sh and deploy-key.sh stream their siblings, so the directory only\n# works whole.\nDEST=\"$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/nas\"\nmkdir -p \"$DEST\"\nfor f in ballast-agent install.sh install-key.sh deploy.sh deploy-key.sh; do\n    cp -p \"$SRCROOT/../nas/$f\" \"$DEST/$f\"\n    chmod 755 \"$DEST/$f\"\ndone";
		};

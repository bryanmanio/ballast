<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Ballast — link preview card</title>
<style>
  @page { size: 1200px 630px; }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    font: 100%/1.5 system-ui, -apple-system, sans-serif;
    color: #1b2027;
    background:
      radial-gradient(90% 120% at 12% 0%, #dce9fb 0%, transparent 60%),
      radial-gradient(80% 110% at 95% 20%, #d9f0f2 0%, transparent 55%),
      #fbfcfd;
    display: grid; grid-template-columns: 1fr 420px; align-items: center;
    gap: 56px; padding: 72px;
    -webkit-font-smoothing: antialiased;
  }
  .mark { width: 76px; height: 76px; border-radius: 18px; background: #2f6fd8;
          display: grid; place-items: center; margin-bottom: 30px; }
  .mark svg { width: 44px; height: 44px; }
  h1 { font-size: 62px; line-height: 1.04; letter-spacing: -0.03em; font-weight: 680; }
  p { font-size: 25px; line-height: 1.45; color: #5a6270; margin-top: 22px; letter-spacing: -0.006em; }
  .url { margin-top: 34px; font-size: 22px; font-weight: 600; color: #2f6fd8; letter-spacing: -0.01em; }
  .pop { width: 400px; background: #fff; border: 1px solid #e3e7ec; border-radius: 15px;
         box-shadow: 0 30px 70px -18px rgba(27,32,39,.3); overflow: hidden; }
  .ph { display:flex; align-items:baseline; gap:8px; padding: 13px 16px; }
  .ph b { font-size: 16px; font-weight: 600; }
  .ph span { font-size: 13.5px; color: #7b8290; }
  .pd { height:1px; background:#eceff3; }
  .pl { padding: 7px; }
  .r { display:flex; align-items:center; gap:11px; padding: 7px 11px; font-size: 16px; }
  .r i { width:11px; height:11px; border-radius:50%; background:#2aa45c; flex:none; }
  .r.bad i { background:#d8442c; }
  .r.warn i { background:#e08a1e; }
  .r u { margin-left:auto; font: 500 13.5px ui-monospace, Menlo, monospace; color:#8c93a0;
         text-decoration:none; }
</style></head><body>
  <div>
    <div class="mark"><svg viewBox="0 0 32 32">
      <path d="M16 7.75a8.25 8.25 0 1 0 0 16.5 8.25 8.25 0 0 0 0-16.5Zm0 2.1a6.15 6.15 0 1 1 0 12.3 6.15 6.15 0 0 1 0-12.3Z" fill="#fff"/>
      <path d="M9.09 17.5h13.82a8.25 8.25 0 0 1-13.82 0Z" fill="#fff"/>
    </svg></div>
    <h1>Your NAS services,<br>in the menu bar.</h1>
    <p>Ballast lists the Docker services on your Synology, shows which ones are actually up, and opens them in a click.</p>
    <div class="url">ballast.ing</div>
  </div>
  <div class="pop">
    <div class="ph"><b>Ballast</b><span>11 up · 1 needs attention</span></div>
    <div class="pd"></div>
    <div class="pl">
      <div class="r"><i></i>immich-server<u>2283</u></div>
      <div class="r bad"><i></i>jellyfin<u>8096</u></div>
      <div class="r"><i></i>paperless-webserver<u>8000</u></div>
      <div class="r"><i></i>plex<u>32400</u></div>
      <div class="r warn"><i></i>uptime-kuma<u>3001</u></div>
      <div class="r"><i></i>vaultwarden<u>8222</u></div>
    </div>
  </div>
</body></html>

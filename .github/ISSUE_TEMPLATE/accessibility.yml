name: Accessibility problem
description: Something in Ballast is hard or impossible to use with assistive technology or accessibility settings.
labels: ["accessibility", "bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What were you trying to do, and what got in the way?
    validations:
      required: true
  - type: input
    id: technology
    attributes:
      label: Assistive technology or setting
      placeholder: "VoiceOver, Full Keyboard Access, Reduce Motion, Increase Contrast..."
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Ballast and macOS versions
      placeholder: "Ballast 1.3 (5), macOS 26.1"
    validations:
      required: true
